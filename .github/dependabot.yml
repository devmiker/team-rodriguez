# Dependency updates.
#
# Three ecosystems, because this repository has three dependency trees and a stale one
# is a stale one regardless of which. The GitHub Actions entry matters more than it
# looks: the workflow pins actions to commit SHAs, and without this those pins would
# quietly rot.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch churn, separate PRs for anything that could
      # actually break — which is where review effort is worth spending.
      patch:
        update-types: [patch]
    ignore:
      # @types/node describes the Node API, so its major must match the runtime the
      # code actually runs on, not the newest Node: Node 22 (engines in package.json,
      # node-version in ci.yml, apiRuntime in public/staticwebapp.config.json). A
      # newer major types APIs that do not exist at runtime. Bump it by hand, in the
      # same commit, when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler and has no programmatic API yet, and
      # `astro check` (@astrojs/check) needs that API, so it refuses to run on 7.
      # Remove this once @astrojs/check accepts typescript ^7 in its peer range.
      # (api/ has no such dependency and is already on 7; see its entry below.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Same rule as the root: the major tracks the Functions runtime (node:22 in
      # public/staticwebapp.config.json), and is bumped by hand when that moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Kept on the same TypeScript major as the root, which cannot move to 7 until
      # @astrojs/check supports it. One compiler across the repo, moved together.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
